name: "Zap-HA"
version: "1.0.1"
slug: zap_ha
description: "WhatsApp para o Home Assistant com Baileys: QR code ou código de pareamento, fila de envio com confirmação e evento de mensagem recebida"
url: "https://github.com/rede7com/Zap-HA"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:whatsapp"
panel_title: "Zap-HA"
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8066]/saude"
ports:
  8066/tcp: 8066
ports_description:
  8066/tcp: "Envio (com token) e mídia recebida"
map:
  - homeassistant_config:rw
options:
  validade_fila_horas: 6
  dias_midia: 7
schema:
  validade_fila_horas: "int(1,72)"
  dias_midia: "int(1,90)"
